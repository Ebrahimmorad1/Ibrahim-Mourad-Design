<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المشروعات | Ibrahim Mourad Design</title>
  <style>
    :root {
      --bg: #f9f8f6;
      --card-bg: #ffffff;
      --text-primary: #1c1917;
      --text-secondary: #78716c;
      --accent: #9a7b56;
      --border: #e7e5e4;
      --shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text-primary);
      padding: 32px 16px;
      line-height: 1.6;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 24px;
    }
    .nav-back:hover { color: var(--accent); }
    .project-header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    .project-category {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    h1 { font-size: 26px; font-weight: 700; margin: 6px 0 12px; }
    p { color: var(--text-secondary); font-size: 14px; }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .gallery-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .gallery-item img:hover {
      transform: scale(1.02);
    }
    .cover-item {
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="nav-back">→ العودة للصفحة الرئيسية</a>

    <header class="project-header">
      <div class="project-category">Interior Architecture & Design</div>
      <h1>مشروع التصميم الداخلي الإسلامي (Islamic Project)</h1>
      <p>دراسة وتصميم فراغات معمارية بروح إسلامية معاصرة تعتمد على الاتزان، الضوء الطبيعي، والتفاصيل الخشبية والزخرفية الدقيقة.</p>
    </header>

    <section class="gallery-grid">
      <!-- الصورة رقم 1 (الغلاف الرئيسي) -->
      <div class="gallery-item cover-item">
        <img src="images/1.jpg" alt="غلاف مشروع التصميم الإسلامي - 1">
      </div>
      <!-- باقي الصور -->
      <div class="gallery-item">
        <img src="images/2.jpg" alt="مشروع التصميم الإسلامي - 2" onerror="this.style.display='none'">
      </div>
      <div class="gallery-item">
        <img src="images/3.jpg" alt="مشروع التصميم الإسلامي - 3" onerror="this.style.display='none'">
      </div>
      <div class="gallery-item">
        <img src="images/4.jpg" alt="مشروع التصميم الإسلامي - 4" onerror="this.style.display='none'">
      </div>
    </section>
  </div>
</body>
</html>
